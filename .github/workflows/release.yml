name: release

# A merge that sets a new version in pyproject.toml (such as "Release 1.2.0") is
# tagged v<version> and published as a GitHub release with the wheel and sdist.
on:
  push:
    branches: [main]
    paths: [pyproject.toml, .github/workflows/release.yml]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Read the version
        id: version
        run: |
          tag="v$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          gh release view "$tag" > /dev/null 2>&1 || echo "new=true" >> "$GITHUB_OUTPUT"
      - name: Build and publish
        if: steps.version.outputs.new
        run: |
          python -m pip install build
          python -m build
          python tests/check_distribution.py
          python -m pip install --no-deps dist/*.whl
          test "v$(python -I -c 'import afdep; print(afdep.__version__)')" = "${{ steps.version.outputs.tag }}"
          gh release create "${{ steps.version.outputs.tag }}" dist/* \
            --target "$GITHUB_SHA" --title "afdEP-comm ${{ steps.version.outputs.tag }}" \
            --generate-notes
